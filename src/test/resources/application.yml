spring:
  application:
    name: shareiscare

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: test-only-secret-key-not-used-outside-the-test-suite
  expiration-ms: 86400000

otp:
  expiry-minutes: 5

app:
  upload-dir: ./target/test-uploads
